name: KioskMode
options:
  bundleIdPrefix: com.max
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"     # iPad only
    PRODUCT_BUNDLE_IDENTIFIER: com.max.kioskmode
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_OBJC_BRIDGING_HEADER: Sources/KioskMode-Bridging-Header.h
    # Unsigned build — the device runs it via AppSync Unified after an ldid pseudo-sign.
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: "NO"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # LSApplicationWorkspace/LSApplicationProxy are private classes with no link
    # stub in the SDK. Allow them to stay undefined at link time; dyld resolves
    # them from the shared cache at load. (The classes really exist on device.)
    OTHER_LDFLAGS:
      - "-Wl,-U,_OBJC_CLASS_$_LSApplicationWorkspace"
      - "-Wl,-U,_OBJC_CLASS_$_LSApplicationProxy"

targets:
  KioskMode:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.generated.plist
      properties:
        CFBundleDisplayName: Kiosk Mode
        CFBundleShortVersionString: "0.3.0"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
