# PulseAudio client.conf for the Xios desktop (rootless iOS).
#
# Belt and suspenders: sessions export PULSE_SERVER (profile.d/xios-pulse.sh),
# but processes that never source profile.d (D-Bus activated helpers, apps
# spawned straight from iosc launchers) still find the daemon through here.

default-server = unix:/var/jb/tmp/pulse/native

# There is no XDG_RUNTIME_DIR/systemd socket activation story on iOS, and the
# daemon binary needs its config anyway; never let libpulse try to spawn one.
autospawn = no
