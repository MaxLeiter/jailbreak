# PulseAudio daemon.conf for the Xios desktop (rootless iOS).
#
# The daemon is a plain fakesigned CLI process; the actual hardware output is
# xios-audiod (CoreAudio RemoteIO), reached through module-xios-sink. Keep the
# scheduling story boring: no realtime, no shm surprises across differently
# signed processes until that is validated on-device.

daemonize = no
fail = yes
allow-module-loading = yes
allow-exit = yes
use-pid-file = yes

; system-wide mode stays off; the daemon runs inside the desktop session.
system-instance = no

high-priority = no
nice-level = -1
realtime-scheduling = no

; POSIX shm between fakesigned processes is untested on this platform; the
; socket copy path is more than fast enough for stereo 48 kHz.
enable-shm = no
enable-memfd = no

; The session owns the daemon lifecycle; never exit on idle.
exit-idle-time = -1

; speex/soxr are compiled out; be explicit instead of letting the daemon warn
; and pick a fallback at runtime. trivial is audibly fine for 44.1->48 UI/media
; playback; revisit with soxr if music playback warrants it.
resample-method = trivial

flat-volumes = no

default-sample-format = float32le
default-sample-rate = 48000
default-sample-channels = 2

; Match module-xios-sink's 25 ms block clock.
default-fragments = 4
default-fragment-size-msec = 25
