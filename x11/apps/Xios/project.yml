name: Xios
options:
  bundleIdPrefix: com.max
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"          # iPad
    PRODUCT_BUNDLE_IDENTIFIER: com.max.xios
    MARKETING_VERSION: "0.1.12"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    # Single source of truth for the app's entitlements. Codesigning is off (the
    # device install pseudo-signs with `ldid -S entitlements.plist`), but wiring
    # this in keeps the project self-consistent and lets a signed build embed them.
    CODE_SIGN_ENTITLEMENTS: entitlements.plist
    ENABLE_BITCODE: "NO"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_OBJC_BRIDGING_HEADER: Sources/Xios-Bridging-Header.h
    # IOSurface backs the zero-copy framebuffer (XSurface.c does the mach-port
    # hand-off + IOSurfaceLookupFromMachPort).
    #
    # MetalFX is WEAK-linked: present-side spatial upscaling (XiosUpscale.swift) is
    # opt-in, and a device without the framework must degrade to the direct present
    # rather than fail to launch. Every use is gated on NSClassFromString +
    # MTLFXSpatialScalerDescriptor.supportsDevice, so a null class is never touched.
    # Verify after a build with: otool -L Xios | grep MetalFX  (expect "weak").
    OTHER_LDFLAGS: -weak_framework MetalFX -framework IOSurface -framework Foundation -framework Metal

targets:
  Xios:
    type: application
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"          # iPad
    dependencies:
      - target: XiosShare
        embed: true
      # embed puts the built .appex in Xios.app/PlugIns/. codeSign stays off to match
      # the rest of the app: bin/lib/build-app.sh ldid-signs the extension separately,
      # with XiosFileProvider/entitlements.plist.
      - target: XiosFileProvider
        embed: true
        codeSign: false
    sources:
      - path: Sources
      # Shared with the XiosFileProvider target: the app creates the shared root and
      # names the domain, the extension serves it, and both must agree on the path and
      # the identifier scheme or the domain points somewhere the desktop is not using.
      - path: XiosFileProvider/XiosSharedRoot.swift
      - path: ../shared/XiosHardwareKeyboard.swift
      - path: ../shared/XiosHardwareKeymap.swift
      - path: ../shared/XiosMetalEventBroker.m
        compilerFlags:
          - -fno-objc-arc
      # Same runtime-visibility producer iosc links (docs/ios-platform-features.md §0),
      # so the app's pacing/upscale state lands in the same `xios-status` table.
      - path: ../shared/iosc_status.c
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.generated.plist
      properties:
        CFBundleDisplayName: X11
        CFBundleShortVersionString: "0.1.12"
        UILaunchScreen: {}
        # Fallback route for the share extension. An appex cannot reach the host
        # app's memory, and if its sandbox denies /var/jb/tmp it cannot reach
        # ioscd either — so it hands the URL back through this scheme and the app
        # (which can reach the socket) performs the OPEN_URL. See
        # XiosShare/ShareViewController.swift and AppDelegate's handler.
        CFBundleURLTypes:
          - CFBundleURLName: com.max.xios.open
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - xios
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSupportsIndirectInputEvents: true
        NSCameraUsageDescription: Xios exposes the iPad camera to desktop media clients.
        NSMicrophoneUsageDescription: Xios exposes the iPad microphone to desktop media clients.
        NSPhotoLibraryUsageDescription: Xios lets you choose a photo as the iosc desktop background.
        # Runtime-gated in XServerViewController: compositor sessions can rotate
        # and resize their IOSurface.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # Share sheet -> Linux desktop. A SEPARATE PROCESS with a separate sandbox and
  # its own entitlements (XiosShare/entitlements.plist); it reaches the desktop
  # only through /var/jb/tmp/ioscd.sock, never through the app's memory.
  #
  # It re-uses the app's socket/paths/models sources rather than duplicating them.
  # Listing individual files (not `path: Sources`) keeps the appex from pulling in
  # XScreen.swift and the whole UIKit compositor surface.
  #
  # bin/lib/build-app.sh pseudo-signs this nested bundle with its own entitlements
  # before signing the outer app; bin/package-app.sh chmods its binary 0755. An
  # appex that is unsigned or non-executable does not error — it silently never
  # loads and simply never appears in the share sheet.
  XiosShare:
    type: app-extension
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"          # iPad
        PRODUCT_BUNDLE_IDENTIFIER: com.max.xios.share
        PRODUCT_NAME: XiosShare
        CODE_SIGN_ENTITLEMENTS: XiosShare/entitlements.plist
        # The app target's bridging header and IOSurface/Metal/MetalFX link flags
        # are meaningless here; reset them so the extension links lean.
        SWIFT_OBJC_BRIDGING_HEADER: ""
        OTHER_LDFLAGS: ""
    sources:
      # excludes: these are build INPUTS, not payload. Without this xcodegen puts
      # them in Copy Bundle Resources and the signed .appex ships its own
      # entitlements file inside itself.
      - path: XiosShare
        excludes:
          - entitlements.plist
          - Info.generated.plist
      - path: Sources/XiosSocket.swift
      - path: Sources/XiosRuntimePaths.swift
      - path: Sources/XiosControl.swift
      - path: Sources/XiosDisplayModels.swift
    info:
      path: XiosShare/Info.generated.plist
      properties:
        CFBundleDisplayName: Open on Desktop
        CFBundleShortVersionString: "0.1.12"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          # @objc(ShareViewController) pins the ObjC name, so no module prefix.
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              # A link from Safari, or a file from Files. Text is accepted too
              # because a shared string is often just a URL.
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
              NSExtensionActivationSupportsText: true

  # Publishes the desktop's shared folder into the iPad Files app. Runs in its own
  # process with its own sandbox, so it inherits none of the app's exceptions and
  # declares only the one path it needs.
  XiosFileProvider:
    type: app-extension
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"
        # Extensions must be namespaced under the host app's bundle id.
        PRODUCT_BUNDLE_IDENTIFIER: com.max.xios.fileprovider
        CODE_SIGN_ENTITLEMENTS: XiosFileProvider/entitlements.plist
        # The project-level `settings.base` is inherited by every target, so the
        # app-specific bits are cleared here: the bridging header pulls in the
        # compositor/IOSurface C headers, the link flags pull in Metal and MetalFX,
        # and the asset catalog does not exist in this target. None of it belongs in
        # a file provider, and each would fail the build rather than bloat it.
        SWIFT_OBJC_BRIDGING_HEADER: ""
        OTHER_LDFLAGS: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    sources:
      # Same as XiosShare: these are build inputs, not payload, so they stay out of
      # Copy Bundle Resources.
      - path: XiosFileProvider
        excludes:
          - entitlements.plist
          - Info.generated.plist
    info:
      path: XiosFileProvider/Info.generated.plist
      properties:
        CFBundleDisplayName: Xios
        CFBundleShortVersionString: "0.1.12"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderSupportsEnumeration: true
