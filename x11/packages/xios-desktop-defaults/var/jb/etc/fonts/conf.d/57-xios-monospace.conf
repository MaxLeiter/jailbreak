<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Xios desktop defaults: keep the system monospace on Apple's .SF UI Mono.
     x11-fonts-sf already maps generic "monospace" to the live iOS San
     Francisco Mono family; this file stays in place so upgrades from older
     xios-desktop-defaults releases replace the former Source Code Pro override
     instead of leaving it installed. fc-cache runs in the postinst. -->
<fontconfig>
  <!-- generic "monospace" -> .SF UI Mono, matching x11-fonts-sf -->
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>.SF UI Mono</string></edit>
  </match>

  <!-- keep the alias form too, for code paths that resolve <alias> directly -->
  <alias>
    <family>monospace</family>
    <prefer><family>.SF UI Mono</family></prefer>
  </alias>
</fontconfig>
