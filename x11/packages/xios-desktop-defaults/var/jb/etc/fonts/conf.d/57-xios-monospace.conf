<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Xios desktop defaults: make Source Code Pro the system monospace.
     Without this, fontconfig resolves the generic "monospace" family to
     Apple's .SF UI Mono (San Francisco Mono), which renders wide/spaced-out
     in VTE terminals. Source Code Pro is also the stock GNOME monospace
     default, so this aligns every layer. Shipped by xios-desktop-defaults;
     fc-cache runs in the postinst.

     Why a strong "prepend_first" match and not a plain <alias><prefer>:
     the x11-fonts-sf package (conf.d/09-x11-fonts-sf.conf) forces
     monospace -> .SF UI Mono with a strong-binding match. A weak <alias>
     loses to that on two counts. First, a strong binding outscores a weak
     one no matter the list position. Second, fontconfig's "prepend" inserts
     a family right before the matched "monospace" token, so the lowest
     numbered conf (09 = SF) lands ahead of a higher numbered one (57 = us).
     "prepend_first" puts Source Code Pro at the very front of the family
     list, and the strong binding matches SF's, so we win regardless of
     conf.d ordering. -->
<fontconfig>
  <!-- make sure our bundled fonts dir is scanned -->
  <dir>/var/jb/usr/share/fonts</dir>

  <!-- generic "monospace" -> Source Code Pro, ahead of x11-fonts-sf -->
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Source Code Pro</string></edit>
  </match>

  <!-- keep the alias form too, for code paths that resolve <alias> directly -->
  <alias>
    <family>monospace</family>
    <prefer><family>Source Code Pro</family></prefer>
  </alias>
</fontconfig>
