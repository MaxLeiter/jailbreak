<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- The stock fonts.conf on this system scans only the iOS font locations
       (/System/Library/Fonts, /Library/Fonts, ~/Library/Fonts and the MobileAsset
       dirs). Nothing scans the normal package font path, so a font installed by a
       deb was invisible to fontconfig no matter how many times fc-cache ran.
       Add it, so packaged fonts are actually found. -->
  <dir>/var/jb/usr/share/fonts</dir>
</fontconfig>
