<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- x11-fonts-sf: expose the live iOS system fonts to X11/fontconfig apps and make
       San Francisco the default. No font files are copied or redistributed — we point
       fontconfig straight at /System/Library/Fonts, so it always tracks the OS. -->

  <!-- San Francisco (.SF UI / .SF UI Mono) live here; the dir is scanned recursively,
       so emoji (Apple Color Emoji), CJK (PingFang), etc. come along for free. -->
  <dir>/System/Library/Fonts</dir>

  <!-- Generic family -> San Francisco. Strong binding + prepend so SF wins over the
       stock 60-latin defaults regardless of conf.d ordering. -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>.SF UI</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>.SF UI</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>.SF UI Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>.SF UI</string></edit>
  </match>

  <!-- Also resolve the generic aliases directly (for code paths that follow <alias>). -->
  <alias><family>sans-serif</family><prefer><family>.SF UI</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>.SF UI</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>.SF UI Mono</family></prefer></alias>
  <alias><family>serif</family><prefer><family>.SF UI</family></prefer></alias>
</fontconfig>
